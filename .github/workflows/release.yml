name: release

# Tag push (v*) -> verify versions -> build Windows/macOS bundles -> publish GitHub Release.
# GitHub Releases is the ONLY supported distribution channel. Nothing is uploaded anywhere
# else, and installers are published under stable version-less asset names so that
# .../releases/latest/download/<asset> keeps working across versions.
#
# workflow_dispatch is a build-only dry run: verify and publish are skipped, both build jobs
# run, and each uploads an artifact whose contents are the exact final release filenames.
#
# pull_request is the same build-only dry run for pull requests, including the ones opened from
# forks: a maintainer adds the "ci:build" label, both build jobs run, and the installers are
# uploaded as run artifacts so they can be installed and tested before the change lands. Every
# later push to a labelled PR rebuilds. A fork PR gets no repository secrets and a read-only
# GITHUB_TOKEN (GitHub enforces both regardless of the permissions below), so verify/publish
# cannot run for it -- publish is tag-push-only anyway -- and the macOS build falls back to
# ad-hoc signing exactly like the dry run. See RELEASING.md section 6 for the operational side.
on:
  push:
    tags: ["v*"]
  # "labeled" starts the first build; "synchronize" rebuilds the PR on every later push (the
  # job-level condition below filters both events down to PRs that carry the label).
  pull_request:
    types: [labeled, synchronize, reopened]
  # Bare dispatch (no inputs) is intentional: `gh workflow run release.yml --ref main`.
  workflow_dispatch:

# One run per ref, so a duplicate tag push cannot race an in-flight release build.
# cancel-in-progress stays false on purpose: a run that is already uploading assets must
# never be killed by a duplicate event (the publish job is create-or-update, i.e. idempotent).
# PR builds are keyed per PR and DO cancel: only the newest commit of a PR is worth testing, and
# otherwise a run would queue for hours behind the previous commit's build of the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-build-{0}', github.event.pull_request.number) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege at the top level; only the publish job opts into contents: write.
permissions:
  contents: read

jobs:
  # Tag pushes only. A dry run (workflow_dispatch or a pull_request) has no tag to compare,
  # so this job is skipped entirely.
  verify:
    name: verify tag matches app version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_exists: ${{ steps.existing.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag, tauri.conf.json and crate versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Tag under test: $TAG"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z (for example v0.1.0)."
            exit 1
          fi
          version="${TAG#v}"

          # First `version =` in the [package] section of each manifest.
          pkg_version() {
            awk -F'"' '
              /^\[package\]/ { inpkg = 1; next }
              /^\[/          { inpkg = 0 }
              inpkg && /^[[:space:]]*version[[:space:]]*=/ { print $2; exit }
            ' "$1"
          }

          conf_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          tauri_version=$(pkg_version src-tauri/Cargo.toml)
          core_version=$(pkg_version crates/core/Cargo.toml)

          failed=0
          check_version() {
            file="$1"; got="$2"
            if [ "$got" != "$version" ]; then
              echo "::error file=$file::version is '$got' but tag '$TAG' implies '$version'."
              failed=1
            else
              echo "OK $file: $got"
            fi
          }
          check_version src-tauri/tauri.conf.json "$conf_version"
          check_version src-tauri/Cargo.toml "$tauri_version"
          check_version crates/core/Cargo.toml "$core_version"
          [ "$failed" -eq 0 ] || exit 1

          # The stable asset names are hard-coded, so the product name is part of the contract.
          product=$(jq -r '.productName' src-tauri/tauri.conf.json)
          if [ "$product" != "OverlaySubs" ]; then
            echo "::error file=src-tauri/tauri.conf.json::productName is '$product'; the release asset contract and macOS app checks assume 'OverlaySubs'."
            exit 1
          fi

      - name: Check whether an identical release is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_exists=false
          expected="SHA256SUMS.txt,overlaysubs-macos-arm64.dmg,overlaysubs-windows-x64-setup.exe,overlaysubs-windows-x64.msi"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "No release exists for $TAG yet; the build will run."
          elif json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets 2>/dev/null); then
            draft=$(printf '%s' "$json" | jq -r '.isDraft // false' 2>/dev/null || echo "unknown")
            prerelease=$(printf '%s' "$json" | jq -r '.isPrerelease // false' 2>/dev/null || echo "unknown")
            actual=$(printf '%s' "$json" | jq -r '[.assets[].name] | sort | join(",")' 2>/dev/null || echo "unknown")
            # Only a PUBLISHED release (draft=false, prerelease=false) with all four assets is
            # a completed release. A draft/prerelease must still be rebuilt and published.
            if [ "$draft" = "false" ] && [ "$prerelease" = "false" ] && [ "$actual" = "$expected" ]; then
              release_exists=true
              echo "::warning::Release $TAG is already published with all four assets; skipping the rebuild. Delete that release first if you intended to rebuild it from this commit."
            else
              echo "Release $TAG exists (draft=$draft, prerelease=$prerelease, assets=[$actual]); rebuilding and publishing."
            fi
          else
            echo "Could not inspect the existing release for $TAG; rebuilding."
          fi
          # Written exactly once: duplicate keys in $GITHUB_OUTPUT are not a documented contract.
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"

  # Runs on tag pushes, on workflow_dispatch, and on pull requests labelled "ci:build".
  # `always()` is required because verify is skipped for a dry run: without it, a skipped
  # `needs` job would skip the builds too. verify failure still blocks the build (and therefore
  # the publish) on tag pushes; publish itself is tag-push-only, so a PR run stops here.
  build:
    name: build (${{ matrix.os }}, ${{ matrix.features }})
    needs: verify
    if: >-
      always()
      && needs.verify.result != 'failure'
      && needs.verify.result != 'cancelled'
      && needs.verify.outputs.release_exists != 'true'
      && (
        github.event_name == 'workflow_dispatch'
        || startsWith(github.ref, 'refs/tags/v')
        || (github.event_name == 'pull_request'
            && contains(github.event.pull_request.labels.*.name, 'ci:build'))
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: vulkan
          - os: macos-15
            features: metal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      # libgit2 hits MAX_PATH on llama.cpp's submodule; the git CLI honours core.longpaths.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # whisper-rs-sys forwards GGML_* environment variables to whisper.cpp's CMake, and ggml
      # defaults GGML_NATIVE=ON, i.e. it compiles for the CPU of the machine that builds it
      # (-march=native / /arch:AVX512). A binary built like that dies with
      # STATUS_ILLEGAL_INSTRUCTION (0xc000001d) on CPUs that lack those instructions, which is
      # exactly what happened to the Windows builds: the first CPU-only code path (the VAD,
      # because GPU VAD is force-disabled upstream) aborted the process on start.
      # llama.cpp already forces GGML_NATIVE=OFF unless target-cpu=native; do the same for
      # whisper.cpp so release binaries run on every supported CPU.
      GGML_NATIVE: "OFF"
      # llama-cpp-sys-2 forwards every CMAKE_* environment variable to llama.cpp's CMake as a
      # cache entry. llama.cpp defaults LLAMA_OPENSSL=ON, and vendor/cpp-httplib then links
      # whatever find_package(OpenSSL) discovers into libllama-common. On the macOS runner that
      # is Homebrew's keg-only openssl@4, so the dylib gets a hard-coded install name such as
      # /opt/homebrew/opt/openssl@4/lib/libssl.4.dylib (issue #35). Those dylibs are not
      # bundled, so the app aborts before showing a window on Macs without that Homebrew keg
      # ("Library not loaded: /opt/homebrew/.../libssl.4.dylib"). HTTPS support in cpp-httplib
      # is unused by this app, so skip find_package(OpenSSL) entirely. Changing this variable
      # requires bumping the rust-cache key below (build scripts are not re-run otherwise).
      CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Keeps the whisper.cpp / llama.cpp builds between runs.
      # Caches the Cargo registry and the target dir. On Windows the build uses
      # CARGO_TARGET_DIR=C:\t (short path for the Vulkan shader build), and this
      # action joins `workspaces: . -> <target>` under the repository root, so an
      # absolute target dir has to be added via `cache-directories` instead of
      # `workspaces` (that mapping produced `<repo>\C:\t` and cached nothing).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-directories: ${{ runner.os == 'Windows' && 'C:\t' || '' }}
          # Bump the suffix whenever the C/C++ build flags change: cargo does not rerun
          # whisper-rs-sys/llama-cpp-sys build scripts for a changed GGML_*/CMAKE_* environment,
          # so a restored target dir would keep the old objects. "native-off" is the
          # GGML_NATIVE=OFF build below; "no-openssl" is CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=ON
          # (without the bump, cached llama dylibs still link Homebrew's openssl@4).
          key: ${{ matrix.features }}-native-off-no-openssl
          # PR runs only restore the cache. A PR's caches are scoped to its merge ref, but they
          # still consume the repository's cache quota, and evicting the entry the next release
          # build restores would turn every release into a from-scratch C/C++ rebuild.
          save-if: ${{ github.event_name != 'pull_request' }}

      # The cached target dir also holds the installers of the run that saved the cache
      # (target/release/bundle, C:\t\release\bundle on Windows). They are named after the app
      # version, so an older one sat next to the new build and the staging step's
      # `Select-Object -First 1` picked it: v0.2.1's Windows assets were the 0.1.0 installers from
      # an earlier dry run. Start every build from an empty bundle dir.
      - name: Remove installers restored from the cache
        shell: bash
        run: |
          set -euo pipefail
          dir=${{ runner.os == 'Windows' && '/c/t/release/bundle' || 'target/release/bundle' }}
          if [ -d "$dir" ]; then
            echo "Removing restored bundles:"
            find "$dir" -maxdepth 2 -type f -print
            rm -rf "$dir"
          fi

      # --- Windows: Vulkan SDK (same pin as the previous ci.yml bundle job) ---
      - name: Install Vulkan SDK
        if: matrix.features == 'vulkan'
        shell: pwsh
        run: |
          $v = "1.4.313.2"
          curl.exe -fL -o vk.exe "https://sdk.lunarg.com/sdk/download/$v/windows/vulkansdk-windows-X64-$v.exe"
          ./vk.exe --accept-licenses --default-answer --confirm-command install | Out-Null
          if (!(Test-Path "C:\VulkanSDK\$v\Include\vulkan\vulkan.h")) { throw "Vulkan SDK install failed" }
          "VULKAN_SDK=C:\VulkanSDK\$v" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$v\Bin" >> $env:GITHUB_PATH

      # llama.cpp's Vulkan backend builds its shader generator through CMake's
      # ExternalProject_Add. MSBuild in parallel mode schedules that project's install step
      # before its configure step has produced cmake_install.cmake, which fails the Windows
      # build with:
      #   CMake error : Not a file: .../vulkan-shaders-gen-build/cmake_install.cmake
      #   error MSB8066: Custom build for '...vulkan-shaders-gen-install.rule' exited with code 1
      # Ninja expresses those inter-target dependencies correctly (and builds faster), so use it
      # on Windows. Ninja invokes cl.exe / link.exe directly, so export the MSVC environment first.
      - name: Set up MSVC environment and Ninja generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with the MSVC C++ tools was not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) { throw "vcvars64.bat not found: $vcvars" }
          # Export INCLUDE/LIB/LIBPATH/PATH so the Ninja build can call cl.exe and link.exe.
          cmd /c "`"$vcvars`" >NUL && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if (-not $ninja) { throw "ninja was not found on PATH (expected on the windows-latest image)" }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake --version | Select-Object -First 1
          ninja --version

      # --- Windows: short target dir + placeholder DLLs, exactly as in the previous ci.yml bundle job ---
      - name: Build Windows binary with staged DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        # MSBuild caps paths at 260 chars; whisper.cpp's Vulkan shader build nests deep, so use a short target dir.
        # The DLLs must exist before tauri-build resolves bundle.resources.
        run: |
          "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
          $env:CARGO_TARGET_DIR = "C:\t"
          New-Item -ItemType Directory -Force src-tauri/libs | Out-Null
          # tauri-build checks the glob during this build too; a placeholder satisfies it until the real DLLs exist.
          New-Item -ItemType File -Force src-tauri/libs/placeholder.dll | Out-Null
          cargo build --release -p overlaysubs --features ${{ matrix.features }}
          Remove-Item src-tauri/libs/placeholder.dll
          Copy-Item C:\t\release\build\llama-cpp-sys-2-*\out\bin\*.dll src-tauri/libs/
          if (!(Test-Path src-tauri/libs/llama.dll)) { throw "llama.dll was not staged" }
          Get-ChildItem src-tauri/libs

      # The npm package ships a prebuilt CLI; `cargo install tauri-cli` took up to 19 minutes.
      - name: Build Windows bundles
        if: runner.os == 'Windows'
        run: npx --yes @tauri-apps/cli@2.12.4 build --features ${{ matrix.features }}
        working-directory: src-tauri

      # Stage the exact final release filenames in the build job, so a workflow_dispatch dry
      # run proves the names and sizes that will be published later.
      - name: Stage Windows installers under the stable asset names
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Exactly one installer of each kind: the bundle dir is emptied before the build, so a
          # second file would be a leftover that must not be published by picking "the first".
          $nsisAll = @(Get-ChildItem "C:\t\release\bundle\nsis\*.exe" -File)
          $msiAll = @(Get-ChildItem "C:\t\release\bundle\msi\*.msi" -File)
          if ($nsisAll.Count -ne 1) { throw "Expected exactly one NSIS installer under C:\t\release\bundle\nsis, found: $($nsisAll.Name -join ', ')" }
          if ($msiAll.Count -ne 1) { throw "Expected exactly one MSI installer under C:\t\release\bundle\msi, found: $($msiAll.Name -join ', ')" }
          $nsis = $nsisAll[0]
          $msi = $msiAll[0]
          # The installers carry the app version in their names; it must be the version being built.
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          foreach ($f in @($nsis, $msi)) {
            if ($f.Name -notlike "*_${version}_*") { throw "$($f.Name) is not an installer for version $version" }
          }
          if ($nsis.Name -notlike "*-setup.exe") { throw "Unexpected NSIS installer name: $($nsis.Name)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $nsis.FullName "dist\overlaysubs-windows-x64-setup.exe" -Force
          Copy-Item $msi.FullName "dist\overlaysubs-windows-x64.msi" -Force
          $expected = @("overlaysubs-windows-x64-setup.exe", "overlaysubs-windows-x64.msi")
          $actual = @(Get-ChildItem dist -File | ForEach-Object { $_.Name })
          if (Compare-Object $expected $actual) { throw "dist does not contain exactly the expected files: $($actual -join ', ')" }
          foreach ($name in $expected) {
            $size = (Get-Item (Join-Path dist $name)).Length
            if ($size -lt 5MB) { throw "$name is implausibly small ($size bytes, expected at least 5 MB)" }
            "{0}: {1} bytes" -f $name, $size
          }
          Get-ChildItem dist
          # Make the dry-run artifact names/sizes visible on the run summary page.
          $summary = @("## Windows distribution artifacts", "", "| file | bytes |", "|---|---|")
          foreach ($name in $expected) { $summary += "| $name | $((Get-Item (Join-Path dist $name)).Length) |" }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows dist artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: overlaysubs-windows-dist
          path: dist/
          if-no-files-found: error
          # PR builds are disposable test installers, so they expire sooner than a dry run's.
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}

      # The ScreenCaptureKit bindings statically link a Swift bridge (via apple-metal) whose
      # sources reference Metal APIs that only exist in the macOS 26 SDK (MTLTensor*,
      # MTLSamplerReductionMode, lodBias). The macos-15 image defaults to Xcode 16.4 with the
      # macOS 15.5 SDK, so select a preinstalled Xcode 26 instead of switching runner images.
      # tauri-cli still sets MACOSX_DEPLOYMENT_TARGET to minimumSystemVersion (13.0), so the
      # produced app keeps its macOS 13 deployment target.
      - name: Select Xcode 26 for the ScreenCaptureKit Swift bridge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcode=$(python3 - <<'PY'
          import glob
          import re

          versions = []
          for path in glob.glob("/Applications/Xcode_26*.app"):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$", path)
              if match:
                  versions.append((tuple(int(part) for part in match.group(1).split(".")), path))
          print(max(versions)[1] if versions else "")
          PY
          )
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 is installed, but the ScreenCaptureKit Swift bridge needs the macOS 26 SDK."
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      # --- macOS ---
      # Tauri does not ad-hoc sign by default. On Apple Silicon an unsigned .app downloaded
      # from the internet is rejected as "damaged", so unless a real Developer ID is configured
      # (APPLE_SIGNING_IDENTITY secret -> picked up by the Tauri CLI), pass signingIdentity "-"
      # as a one-off CLI override. It is deliberately NOT written into tauri.conf.json, so that
      # adding a real certificate later needs no config change.
      - name: Build macOS bundles (ad-hoc signed unless a Developer ID is configured)
        if: runner.os == 'macOS'
        working-directory: src-tauri
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          args=(build --features metal)
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY is configured; letting Tauri sign with the Developer ID."
          else
            echo "No APPLE_SIGNING_IDENTITY configured; using ad-hoc signing (signingIdentity \"-\")."
            # Single-quoted JSON string: bash passes it through as one argv element, double quotes
            # stay part of the JSON, and no shell expansion happens on the braces.
            # hardenedRuntime must be OFF for ad-hoc builds: with it on, the hardened runtime's
            # library validation rejects the bundled llama/ggml dylibs and the app crashes on launch
            # ("different Team IDs", Tauri issue #9318). Developer ID builds keep the default (on).
            args+=(--config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}')
            # GitHub exports a missing secret as DEFINED BUT EMPTY. tauri-cli does
            # `env::var_os("APPLE_SIGNING_IDENTITY")` -> Some("") and treats that as an explicit
            # identity, which overrides the --config above and makes it run `codesign -s ""`
            # (failure). Remove the variable from the environment for the ad-hoc branch only.
            unset APPLE_SIGNING_IDENTITY
          fi
          npx --yes @tauri-apps/cli@2.12.4 "${args[@]}"

      - name: Verify macOS bundle is signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # `tauri build` removes the intermediate .app after it creates the DMG, so verify what
          # users actually download: mount the DMG and inspect (and launch-test what we can of) the
          # app inside it.
          dmg=$(find . -type f -name '*.dmg' -path '*/release/bundle/dmg/*' -print -quit)
          if [ -z "$dmg" ] || [ ! -s "$dmg" ]; then
            echo "::error::no non-empty .dmg under */release/bundle/dmg/ - the macOS bundle was not produced."
            exit 1
          fi
          echo "dmg: $dmg"
          ls -lh "$dmg"

          mountpoint=$(mktemp -d)
          cleanup() { hdiutil detach "$mountpoint" -quiet -force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null || {
            echo "::error::could not mount $dmg"
            exit 1
          }
          # productName (OverlaySubs) and the Cargo binary name (overlaysubs) differ, so do not
          # hard-code either: locate the .app inside the mounted DMG, then read CFBundleExecutable.
          app=$(find "$mountpoint" -type d -name '*.app' -print -quit)
          if [ -z "$app" ] || [ ! -d "$app" ]; then
            echo "::error::no .app bundle found inside $dmg"
            ls -la "$mountpoint"
            exit 1
          fi
          echo "app: $app"
          echo "app bundle name: $(basename "$app")"

          executable_name=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist" 2>/dev/null || true)
          if [ -z "$executable_name" ] || [ ! -x "$app/Contents/MacOS/$executable_name" ]; then
            echo "CFBundleExecutable is unusable ('$executable_name'); falling back to the first executable in Contents/MacOS"
            executable_name=""
            for candidate in "$app/Contents/MacOS"/*; do
              if [ -f "$candidate" ] && [ -x "$candidate" ]; then
                executable_name=${candidate##*/}
                break
              fi
            done
          fi
          if [ -z "$executable_name" ] || [ ! -x "$app/Contents/MacOS/$executable_name" ]; then
            echo "::error::no runnable main executable found in $app/Contents/MacOS"
            ls -la "$app/Contents/MacOS"
            exit 1
          fi
          echo "main executable: $app/Contents/MacOS/$executable_name"

          # The MIT notices for the bundled native libraries must ship inside the app.
          if [ ! -f "$app/Contents/Resources/THIRD_PARTY_NOTICES.md" ]; then
            echo "::error::THIRD_PARTY_NOTICES.md is missing from the app's Contents/Resources"
            exit 1
          fi
          echo "THIRD_PARTY_NOTICES.md is bundled at Contents/Resources"

          # Fail hard if the .app carries no signature at all (that is the "damaged" case for users).
          if ! codesign -dv --verbose=2 "$app" > /tmp/codesign.txt 2>&1; then
            echo "::error::codesign found no signature on $app"
            cat /tmp/codesign.txt || true
            exit 1
          fi
          cat /tmp/codesign.txt
          if ! grep -qE '^Signature=adhoc$|^Authority=' /tmp/codesign.txt; then
            echo "::error::$app has no ad-hoc/Developer ID signature"
            exit 1
          fi

          # Ad-hoc + hardened runtime is fatal at launch: library validation rejects the bundled
          # llama/ggml dylibs (Tauri issue #9318). The build step turns the runtime off for ad-hoc.
          if grep -q '^Signature=adhoc$' /tmp/codesign.txt; then
            if grep -qE 'flags=.*\(.*runtime' /tmp/codesign.txt; then
              echo "::error::ad-hoc signature has hardened runtime enabled - the bundled Frameworks dylibs would fail library validation and the app would crash on launch."
              exit 1
            fi
            echo "ad-hoc signature without hardened runtime: bundled dylibs can load."
          fi

          codesign --verify --strict "$app"

          # Every Mach-O file inside the .app must only depend on macOS system libraries or on
          # files that ship in the same bundle. Checking just the main executable's @rpath
          # entries is not enough: v0.2.4 passed that check while Contents/Frameworks/
          # libllama-common.0.dylib still loaded Homebrew's /opt/homebrew/opt/openssl@4/lib/
          # libssl.4.dylib, so the app died before showing a window on Macs without that keg
          # (issue #35). Walk all Mach-O files, including the nested Frameworks dylibs.
          frameworks="$app/Contents/Frameworks"
          if [ ! -d "$frameworks" ]; then
            echo "::error::no Contents/Frameworks directory in the app bundle"
            exit 1
          fi
          for lib in "$frameworks"/*; do
            [ -e "$lib" ] || continue
            if ! codesign --verify --strict "$lib" > /dev/null 2>&1; then
              echo "::warning::$lib has no valid code signature (ad-hoc linker signature expected)"
            fi
          done
          python3 - "$app" <<'PY'
          import os
          import struct
          import sys

          MH_MAGIC_64 = 0xFEEDFACF
          FAT_MAGIC = 0xCAFEBABE
          FAT_MAGIC_64 = 0xCAFEBABF
          LC_LOAD_DYLIB = 0xC
          LC_LOAD_WEAK_DYLIB = 0x80000018
          LC_REEXPORT_DYLIB = 0x8000001F
          LC_LOAD_UPWARD_DYLIB = 0x80000023
          LC_RPATH = 0x8000001C
          DYLIB_COMMANDS = {
              LC_LOAD_DYLIB,
              LC_LOAD_WEAK_DYLIB,
              LC_REEXPORT_DYLIB,
              LC_LOAD_UPWARD_DYLIB,
          }
          # Provided by macOS itself; anything else has to ship inside the .app.
          SYSTEM_PREFIXES = ("/usr/lib/", "/System/Library/", "/Library/Apple/")
          # The Swift runtime ships with macOS (12.0+) at /usr/lib/swift. The linker records
          # @rpath/libswift*.dylib for those libraries, so an app linking a Swift static bridge
          # may depend on them even though they must NOT be bundled (macOS 13 is our minimum).
          SWIFT_RUNTIME_PREFIX = "libswift"
          SWIFT_RUNTIME_RPATH = "/usr/lib/swift"

          app = os.path.abspath(sys.argv[1])
          contents = os.path.join(app, "Contents")
          macos_dir = os.path.join(contents, "MacOS")
          frameworks_dir = os.path.join(contents, "Frameworks")


          def _string(data, offset):
              end = data.index(b"\0", offset)
              return data[offset:end].decode("utf-8", "replace")


          def _parse_thin(data, offset, dependencies, rpaths):
              """Collect the dylib load commands and LC_RPATH entries of one thin Mach-O image."""
              if struct.unpack_from("<I", data, offset)[0] != MH_MAGIC_64:
                  return  # 32-bit images are not expected in an arm64 bundle
              command_count = struct.unpack_from("<I", data, offset + 16)[0]
              position = offset + 32
              for _ in range(command_count):
                  command, size = struct.unpack_from("<II", data, position)
                  if command in DYLIB_COMMANDS:
                      name_offset = struct.unpack_from("<I", data, position + 8)[0]
                      dependencies.append(_string(data, position + name_offset))
                  elif command == LC_RPATH:
                      path_offset = struct.unpack_from("<I", data, position + 8)[0]
                      rpaths.append(_string(data, position + path_offset))
                  position += size


          def dependencies_of(path):
              """Return (dylib dependencies, rpaths) of path, or None when it is not Mach-O."""
              with open(path, "rb") as handle:
                  data = handle.read()
              if len(data) < 8:
                  return None
              if struct.unpack_from("<I", data, 0)[0] == MH_MAGIC_64:
                  dependencies = []
                  rpaths = []
                  _parse_thin(data, 0, dependencies, rpaths)
                  return dependencies, rpaths
              magic = struct.unpack_from(">I", data, 0)[0]
              if magic not in (FAT_MAGIC, FAT_MAGIC_64):
                  return None
              dependencies = []
              rpaths = []
              for index in range(struct.unpack_from(">I", data, 4)[0]):
                  if magic == FAT_MAGIC:
                      offset = struct.unpack_from(">I", data, 8 + index * 20 + 8)[0]
                  else:
                      offset = struct.unpack_from(">Q", data, 8 + index * 32 + 8)[0]
                  _parse_thin(data, offset, dependencies, rpaths)
              return dependencies, rpaths


          def unbundled_dependency(dependency, owner, rpaths):
              """Return why dependency cannot load on a Mac without Homebrew, or None."""
              if dependency.startswith("/"):
                  if dependency.startswith(SYSTEM_PREFIXES):
                      return None
                  return f"depends on {dependency}, an absolute path outside the macOS system libraries"
              if dependency.startswith("@rpath/"):
                  name = dependency[len("@rpath/"):]
                  if os.path.exists(os.path.join(frameworks_dir, name)):
                      return None
                  # Swift runtime only, and only when this image really searches /usr/lib/swift.
                  if name.startswith(SWIFT_RUNTIME_PREFIX) and any(
                      os.path.normpath(path) == SWIFT_RUNTIME_RPATH for path in rpaths
                  ):
                      return None
                  return f"depends on {dependency}, which is missing from Contents/Frameworks"
              if dependency.startswith("@loader_path/"):
                  relative = dependency[len("@loader_path/"):]
                  if os.path.exists(os.path.normpath(os.path.join(os.path.dirname(owner), relative))):
                      return None
                  return f"depends on {dependency}, which does not resolve next to {os.path.basename(owner)}"
              if dependency.startswith("@executable_path/"):
                  relative = dependency[len("@executable_path/"):]
                  if os.path.exists(os.path.normpath(os.path.join(macos_dir, relative))):
                      return None
                  return f"depends on {dependency}, which does not resolve inside Contents/MacOS"
              return f"depends on {dependency}, which uses an unsupported install name"


          inspected = 0
          problems = 0
          for directory, _, names in os.walk(contents):
              for name in sorted(names):
                  path = os.path.join(directory, name)
                  try:
                      inspected_macho = dependencies_of(path)
                  except (OSError, ValueError, struct.error) as error:
                      print(f"::warning::could not inspect {os.path.relpath(path, app)}: {error}")
                      continue
                  if inspected_macho is None:
                      continue
                  dependencies, rpaths = inspected_macho
                  inspected += 1
                  for dependency in dependencies:
                      problem = unbundled_dependency(dependency, path, rpaths)
                      if problem is not None:
                          print(f"::error::{os.path.relpath(path, app)} {problem}")
                          problems += 1

          if problems:
              print(f"{problems} unbundled dependency(ies) found; the app would fail to launch on a Mac without Homebrew")
              sys.exit(1)
          if inspected == 0:
              print("::error::no Mach-O files were found inside the app bundle")
              sys.exit(1)
          print(f"checked {inspected} Mach-O files; every dependency is a macOS system library or bundled")
          PY

          # Nested Frameworks: arm64 linker output is already ad-hoc signed, so this normally
          # passes; keep it non-fatal so a bundler-level detail cannot block a release.
          if ! codesign --verify --deep --strict "$app" > /dev/null 2>&1; then
            echo "::warning::codesign --verify --deep --strict failed; the app bundle signature itself verifies."
          fi

      - name: Stage macOS dmg under the stable asset name
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Exactly one dmg, for the version being built (see "Remove installers restored from the cache").
          dmgs=$(find . -type f -name '*.dmg' -path '*/release/bundle/dmg/*')
          if [ "$(printf '%s' "$dmgs" | grep -c .)" -ne 1 ]; then
            echo "::error::expected exactly one .dmg under */release/bundle/dmg/, found: ${dmgs:-none}"
            exit 1
          fi
          dmg=$dmgs
          version=$(jq -r .version src-tauri/tauri.conf.json)
          case "$(basename "$dmg")" in
            *"_${version}_"*) ;;
            *) echo "::error::$dmg is not a dmg for version $version"; exit 1 ;;
          esac
          mkdir -p dist
          cp "$dmg" dist/overlaysubs-macos-arm64.dmg
          bytes=$(stat -f%z dist/overlaysubs-macos-arm64.dmg)
          if [ "$bytes" -lt $((10 * 1024 * 1024)) ]; then
            echo "::error::overlaysubs-macos-arm64.dmg is implausibly small ($bytes bytes, expected at least 10 MB)"
            exit 1
          fi
          count=$(find dist -type f | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ] || [ ! -f dist/overlaysubs-macos-arm64.dmg ]; then
            echo "::error::dist does not contain exactly the expected file: $(find dist -type f)"
            exit 1
          fi
          echo "overlaysubs-macos-arm64.dmg: $bytes bytes"
          ls -l dist
          # Make the dry-run artifact name/size visible on the run summary page.
          {
            echo "## macOS distribution artifact"
            echo ""
            echo "| file | bytes |"
            echo "|---|---|"
            echo "| overlaysubs-macos-arm64.dmg | $bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS dist artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: overlaysubs-macos-dist
          path: dist/
          if-no-files-found: error
          # Same 3-day retention as the Windows artifact on pull_request runs.
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}

  # Tag pushes only: a dry run (workflow_dispatch or a pull_request) stops after the builds.
  publish:
    name: publish GitHub release
    needs: [verify, build]
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.verify.outputs.release_exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: overlaysubs-windows-dist
          path: dist/windows

      - uses: actions/download-artifact@v8
        with:
          name: overlaysubs-macos-dist
          path: dist/macos

      - name: Collect the stable-named assets
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for name in \
            overlaysubs-windows-x64-setup.exe \
            overlaysubs-windows-x64.msi \
            overlaysubs-macos-arm64.dmg; do
            src=$(find dist/windows dist/macos -type f -name "$name" -print -quit)
            if [ -z "$src" ]; then
              echo "::error::$name is missing from the downloaded build artifacts"
              exit 1
            fi
            cp "$src" "dist/release/$name"
          done
          ls -l dist/release

      - name: Verify asset sizes and write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist/release
          check_size() {
            file="$1"
            minimum="$2"
            if [ ! -s "$file" ]; then
              echo "::error::$file is missing or empty"
              exit 1
            fi
            bytes=$(stat -c %s "$file")
            if [ "$bytes" -lt "$minimum" ]; then
              echo "::error::$file is implausibly small ($bytes bytes, expected at least $minimum); refusing to publish a broken artifact."
              exit 1
            fi
            echo "$file: $bytes bytes"
          }
          check_size overlaysubs-windows-x64-setup.exe $((5 * 1024 * 1024))
          check_size overlaysubs-windows-x64.msi $((5 * 1024 * 1024))
          check_size overlaysubs-macos-arm64.dmg $((10 * 1024 * 1024))
          sha256sum \
            overlaysubs-windows-x64-setup.exe \
            overlaysubs-windows-x64.msi \
            overlaysubs-macos-arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          human_size() {
            awk -v b="$1" 'BEGIN {
              if (b >= 1000000000) printf "%.2f GB", b / 1000000000;
              else if (b >= 1000000) printf "%.0f MB", b / 1000000;
              else printf "%.1f KB", b / 1000;
            }'
          }
          size_exe=$(human_size "$(stat -c %s dist/release/overlaysubs-windows-x64-setup.exe)")
          size_msi=$(human_size "$(stat -c %s dist/release/overlaysubs-windows-x64.msi)")
          size_dmg=$(human_size "$(stat -c %s dist/release/overlaysubs-macos-arm64.dmg)")

          # Quoted heredoc: no shell expansion, so backticks, $ and quotes stay literal.
          # @@MARKERS@@ are substituted afterwards with sed.
          cat > dist/release-body.md.tmpl <<'BODY'
          このリリースのバージョン: **@@TAG@@**

          PC の音声をリアルタイムで文字起こし・翻訳し、字幕として重ねて表示するアプリです。
          インストーラをダウンロードして実行するだけで使えます。API キーは不要で、音声が外部に送信されることはありません。

          ## ダウンロード

          | ファイル | 対象 | 種類 | サイズ |
          |---|---|---|---|
          | [overlaysubs-windows-x64-setup.exe](https://github.com/sp-yduck/overlaysubs/releases/latest/download/overlaysubs-windows-x64-setup.exe) | Windows 10/11 (64bit) | インストーラ（推奨） | @@SIZE_EXE@@ |
          | [overlaysubs-windows-x64.msi](https://github.com/sp-yduck/overlaysubs/releases/latest/download/overlaysubs-windows-x64.msi) | Windows 10/11 (64bit) | MSI（管理者配布向け） | @@SIZE_MSI@@ |
          | [overlaysubs-macos-arm64.dmg](https://github.com/sp-yduck/overlaysubs/releases/latest/download/overlaysubs-macos-arm64.dmg) | macOS 13 以降（Apple Silicon） | ディスクイメージ | @@SIZE_DMG@@ |
          | [SHA256SUMS.txt](https://github.com/sp-yduck/overlaysubs/releases/latest/download/SHA256SUMS.txt) | すべて | SHA-256 チェックサム | - |

          - Windows は 64bit (x64) のみです。Windows 10 / 11 に対応しています。
          - macOS は Apple Silicon（M1 以降）のみです。macOS 13 以降が必要です。Intel Mac 用のビルドはありません。
          - GitHub アカウントは不要です。上のリンクから直接ダウンロードできます。

          ## インストール

          ### Windows

          1. `overlaysubs-windows-x64-setup.exe` をダウンロードして実行します（MSI 版が必要な場合は `overlaysubs-windows-x64.msi`）。
          2. 「Windows によって PC が保護されました」と表示されたら、**[詳細情報]** をクリックし、**[実行]** を選びます。このアプリはコード署名を行っていないため、初回のみこの警告が表示されます。
          3. 画面の指示に従ってインストールします。初回起動時に利用規約への同意を求められます。

          ### macOS

          1. `overlaysubs-macos-arm64.dmg` をダウンロードして開き、`OverlaySubs` を「Applications」フォルダにドラッグします。
          2. 初回起動時に「開発元を検証できません」と表示されたら、アプリを **右クリック →［開く］** を選び、確認ダイアログで **［開く］** を押します。
             うまくいかない場合は、**[システム設定] → [プライバシーとセキュリティ]** を開き、「セキュリティ」の項目にある **[このまま開く]** を押してください。
          3. 2 回目以降は通常どおり起動できます。

          > [!IMPORTANT]
          > 本アプリは ad-hoc 署名のみ（公証なし）です。そのため macOS では、初回のみ上記の「右クリック→開く」または「システム設定→プライバシーとセキュリティ→このまま開く」の操作が必要です。
          > Gatekeeper を無効化する必要はありません（セキュリティ上、無効化は推奨しません）。

          ## 初回起動時のモデルダウンロード

          初回起動時、音声認識モデルと翻訳モデル（合計で数 GB）を Hugging Face から自動ダウンロードします。回線によっては数分〜十数分かかります。ダウンロードは中断しても再開でき、SHA-256 で検証されます。アカウントやトークンは不要です。2 回目以降はモデルを再利用するため短時間で起動します。
          モデル用に数 GB 以上の空き容量を確保してください。

          ## チェックサムの確認（任意）

          ダウンロードしたファイルが壊れていないか、`SHA256SUMS.txt` と照合できます。

          **Windows（PowerShell）**

          ```powershell
          Get-FileHash .\overlaysubs-windows-x64-setup.exe -Algorithm SHA256
          Get-FileHash .\overlaysubs-windows-x64.msi -Algorithm SHA256
          ```

          **macOS（ターミナル）**

          ```bash
          cd ~/Downloads
          shasum -a 256 overlaysubs-macos-arm64.dmg
          ```

          表示された値が `SHA256SUMS.txt` の該当行と一致すれば正常です。

          ## リンク

          - [公式サイト（インストール・使い方・FAQ）](https://sp-yduck.github.io/overlaysubs/)
          - [README（日本語・仕組みとビルド方法）](https://github.com/sp-yduck/overlaysubs/blob/main/README.ja.md)
          - [README (English)](https://github.com/sp-yduck/overlaysubs#readme)
          - [OverlaySubs 利用規約（日本語）](https://github.com/sp-yduck/overlaysubs/blob/main/licenses/overlaysubs-terms.ja.txt) / [English](https://github.com/sp-yduck/overlaysubs/blob/main/licenses/overlaysubs-terms.en.txt)
          - [PLaMo 3 のライセンス](https://plamo.preferredai.jp/info/plamo-community-license-ja)
          - [リリース一覧](https://github.com/sp-yduck/overlaysubs/releases)

          アプリのコードは MIT ライセンスです。翻訳には Preferred Networks の PLaMo 3 Translate を使用しています（**Built with PLaMo**）。
          BODY

          sed -e "s|@@TAG@@|${TAG}|g" \
              -e "s|@@SIZE_EXE@@|${size_exe}|g" \
              -e "s|@@SIZE_MSI@@|${size_msi}|g" \
              -e "s|@@SIZE_DMG@@|${size_dmg}|g" \
              dist/release-body.md.tmpl > dist/release-body.md

          # Release notes: append the CHANGELOG section for this tag's version
          # ("## [x.y.z] - ..."), but never fail the release because of it.
          version="${TAG#v}"
          version_re=$(printf '%s' "$version" | sed 's/\./\\./g')
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$version_re" '
              $0 ~ "^##[[:space:]]*\\[?" ver "\\]?([[:space:]]|$)" { in_section = 1 }
              in_section && /^##[[:space:]]/ && $0 !~ "^##[[:space:]]*\\[?" ver "\\]?([[:space:]]|$)" { exit }
              in_section && /^\[[^]]+\]:[[:space:]]/ { exit }
              in_section { print }
            ' CHANGELOG.md > dist/changelog-section.md || true
            if [ -s dist/changelog-section.md ]; then
              {
                printf '\n---\n\n## 変更履歴\n\n'
                cat dist/changelog-section.md
                printf '\n'
              } >> dist/release-body.md
              echo "Appended the CHANGELOG.md [$version] section."
            else
              echo "CHANGELOG.md exists but has no [$version] section; skipping it."
            fi
          else
            echo "No CHANGELOG.md in this commit; release notes omit the changelog."
          fi
          echo "----- release body -----"
          cat dist/release-body.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          title="OverlaySubs $TAG"
          assets=(
            dist/release/overlaysubs-windows-x64-setup.exe
            dist/release/overlaysubs-windows-x64.msi
            dist/release/overlaysubs-macos-arm64.dmg
            dist/release/SHA256SUMS.txt
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Idempotent re-run (for example a re-run of a partially failed publish):
            # overwrite assets and re-assert title/notes state instead of failing.
            echo "Release $TAG already exists; uploading assets with --clobber and updating metadata."
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            # No --latest here: re-running an old tag must not move /releases/latest
            # backwards. Only `gh release create` marks the new release as latest.
            gh release edit "$TAG" \
              --title "$title" \
              --notes-file dist/release-body.md \
              --draft=false \
              --prerelease=false \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "${assets[@]}" \
              --title "$title" \
              --notes-file dist/release-body.md \
              --latest \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,assets)
          echo "$json" | jq .
          echo "$json" | jq -e '.isDraft == false and .isPrerelease == false' > /dev/null
          for asset in \
            overlaysubs-windows-x64-setup.exe \
            overlaysubs-windows-x64.msi \
            overlaysubs-macos-arm64.dmg \
            SHA256SUMS.txt; do
            echo "$json" | jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .size > 0)' > /dev/null \
              || { echo "::error::asset $asset is missing or empty in release $TAG"; exit 1; }
          done
          # `releases/latest` can lag for a moment right after a release is published (the API is
          # eventually consistent), which is exactly when this step runs. Poll it for up to a
          # minute and tolerate 404s instead of failing on the first empty response.
          latest=""
          for attempt in $(seq 1 12); do
            if raw=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" 2>/dev/null); then
              latest=$(printf '%s' "$raw" | jq -r '.tag_name // empty')
            fi
            if [ "$latest" = "$TAG" ]; then
              break
            fi
            echo "latest release is '${latest:-<none>}' (attempt ${attempt}/12); /releases/latest can lag after publishing, retrying in 5s"
            sleep 5
          done
          if [ "$latest" != "$TAG" ]; then
            echo "::error::the latest release is '${latest:-<none>}', expected '$TAG'"
            exit 1
          fi
          echo "Release $TAG is published as latest with all four assets."
